<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Loading</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
}

body {
  background: #0a0d14;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

/* ── Logo container with rotating ring ── */
.logo-wrapper {
  position: relative;
  width: 140px; height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Rotating gradient ring */
.logo-wrapper::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  background: conic-gradient(
    transparent 0deg,
    transparent 120deg,
    #4f7fff 180deg,
    #6c63ff 240deg,
    transparent 300deg,
    transparent 360deg
  );
  mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #fff calc(100% - 3px));
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #fff calc(100% - 3px));
  animation: spin 1.8s linear infinite;
}

/* Second counter-rotating ring for depth */
.logo-wrapper::after {
  content: '';
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  background: conic-gradient(
    transparent 0deg,
    transparent 200deg,
    rgba(79, 127, 255, 0.25) 250deg,
    rgba(108, 99, 255, 0.15) 300deg,
    transparent 340deg,
    transparent 360deg
  );
  mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #fff calc(100% - 2px));
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #fff calc(100% - 2px));
  animation: spin-reverse 2.5s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes spin-reverse {
  to { transform: rotate(-360deg); }
}

/* Logo image with soft pulse glow */
.logo-img {
  width: 100px; height: 100px;
  border-radius: 24px;
  object-fit: cover;
  position: relative;
  z-index: 2;
  animation: logo-pulse 2s ease-in-out infinite;
  box-shadow: 0 0 30px rgba(79, 127, 255, 0.2), 0 0 60px rgba(79, 127, 255, 0.1);
}

@keyframes logo-pulse {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 0 30px rgba(79, 127, 255, 0.2), 0 0 60px rgba(79, 127, 255, 0.1);
  }
  50% {
    transform: scale(1.04);
    box-shadow: 0 0 40px rgba(79, 127, 255, 0.35), 0 0 80px rgba(79, 127, 255, 0.15);
  }
}

/* ── Floating particles ── */
.particles {
  position: absolute;
  width: 140px; height: 140px;
  z-index: 1;
}
.particle {
  position: absolute;
  width: 4px; height: 4px;
  background: #4f7fff;
  border-radius: 50%;
  opacity: 0;
  animation: particle-float 3s ease-in-out infinite;
}
.particle:nth-child(1) { top: 0; left: 50%; animation-delay: 0s; }
.particle:nth-child(2) { top: 50%; right: 0; animation-delay: 0.6s; }
.particle:nth-child(3) { bottom: 0; left: 50%; animation-delay: 1.2s; }
.particle:nth-child(4) { top: 50%; left: 0; animation-delay: 1.8s; }
.particle:nth-child(5) { top: 15%; left: 15%; animation-delay: 0.3s; }
.particle:nth-child(6) { bottom: 15%; right: 15%; animation-delay: 0.9s; }
.particle:nth-child(7) { top: 15%; right: 15%; animation-delay: 1.5s; }
.particle:nth-child(8) { bottom: 15%; left: 15%; animation-delay: 2.1s; }

@keyframes particle-float {
  0% { opacity: 0; transform: translate(0, 0) scale(0.5); }
  20% { opacity: 0.8; }
  100% { opacity: 0; transform: translate(var(--dx, 0), var(--dy, -30px)) scale(1); }
}
.particle:nth-child(1) { --dx: 0px; --dy: -25px; }
.particle:nth-child(2) { --dx: 25px; --dy: 0px; }
.particle:nth-child(3) { --dx: 0px; --dy: 25px; }
.particle:nth-child(4) { --dx: -25px; --dy: 0px; }
.particle:nth-child(5) { --dx: -15px; --dy: -15px; }
.particle:nth-child(6) { --dx: 15px; --dy: 15px; }
.particle:nth-child(7) { --dx: 15px; --dy: -15px; }
.particle:nth-child(8) { --dx: -15px; --dy: 15px; }

/* ── App name text with letter animation ── */
.app-name {
  margin-top: 32px;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 1px;
  background: linear-gradient(135deg, #4f7fff, #6c63ff, #7c5cfc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  display: flex;
  gap: 2px;
}

.letter {
  opacity: 0;
  transform: translateY(12px);
  animation: letter-in 0.5s ease forwards;
}
.letter:nth-child(1) { animation-delay: 0.1s; }
.letter:nth-child(2) { animation-delay: 0.18s; }
.letter:nth-child(3) { animation-delay: 0.26s; }
.letter:nth-child(4) { animation-delay: 0.34s; }
.letter:nth-child(5) { animation-delay: 0.42s; }
.letter:nth-child(6) { animation-delay: 0.5s; }
.letter:nth-child(7) { animation-delay: 0.58s; }
.letter:nth-child(8) { animation-delay: 0.66s; }

@keyframes letter-in {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ── Loading bar ── */
.loading-bar-container {
  margin-top: 40px;
  width: 180px;
  height: 3px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 4px;
  overflow: hidden;
  position: relative;
}

.loading-bar-fill {
  width: 40%;
  height: 100%;
  border-radius: 4px;
  background: linear-gradient(90deg, #4f7fff, #6c63ff, #7c5cfc);
  background-size: 200% 100%;
  animation: bar-sweep 1.6s ease-in-out infinite;
}

@keyframes bar-sweep {
  0% { width: 20%; transform: translateX(-60%); }
  50% { width: 40%; transform: translateX(120%); }
  100% { width: 20%; transform: translateX(280%); }
}

/* ── Loading text with animated dots ── */
.loading-text {
  margin-top: 16px;
  font-size: 13px;
  color: rgba(255, 255, 255, 0.35);
  letter-spacing: 3px;
  text-transform: uppercase;
  font-weight: 500;
}

.loading-text::after {
  content: '';
  animation: dots 1.5s steps(4, end) infinite;
}

@keyframes dots {
  0%   { content: ''; }
  25%  { content: '.'; }
  50%  { content: '..'; }
  75%  { content: '...'; }
  100% { content: ''; }
}
</style>
</head>
<body>

<div class="logo-wrapper">
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
  <img class="logo-img" src="splash_logo.png" alt="Logo">
</div>

<div class="app-name">
  <span class="letter">S</span>
  <span class="letter">E</span>
  <span class="letter">N</span>
  <span class="letter">A</span>
  <span class="letter">P</span>
  <span class="letter">O</span>
  <span class="letter">T</span>
  <span class="letter">I</span>
</div>

<div class="loading-bar-container">
  <div class="loading-bar-fill"></div>
</div>

<div class="loading-text">Loading</div>

</body>
</html>
